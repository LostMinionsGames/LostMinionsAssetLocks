name: Feature request
description: Suggest a focused improvement to Lost Minions Asset Locks.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the asset-locking problem you need to solve. Do not include credentials, tokens, private repository URLs, or sensitive logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What asset-locking workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired workflow
      description: Describe the user-facing steps you expect in Unreal Engine.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Explain the expected result and any safety constraints.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why this belongs in an asset-locking plugin
      description: Explain how this remains focused on Git LFS asset locking rather than general Git-client functionality.
    validations:
      required: true
